<!DOCTYPE html>
	<style>
body {margin: 0; touch-action: none;}
.view {display: flex; flex-direction: column;}
.title {display: flex; align-items: center; justify-content: center; height: 20vh; font-size: 10vh; background: yellow;}
#menuContents {display: flex; flex-direction: column; align-items: center; gap: 3vh;}
.menuButton {font-size: 5vh;}
#alphabet {display: grid; grid-template-columns: repeat(7, 1fr); gap: 3%; margin: 2.5%;}
.letter {font-size: 7vh; height: 14vh;}
#subjectButtons {display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(2, 1fr); gap: 2vh;}
.subjectButton > img {width: 30vh; height: 30vh; object-fit: contain;}
#monthButtons {display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(2, 1fr); gap: 2vh;}
.monthButton > img {width: 25vh; height: 25vh; object-fit: contain;}
input {display: none;}
input:checked + label > img {background: lime;}
	</style>
	<body>
<div id="menu" class="view">
	<div class="title">Review: Talk and Listen</div>
	<div id="menuContents">
		<button class="menuButton" value="spellName">How do you spell your name?</button>
		<button class="menuButton" value="subject">What subject do you like?</button>
		<button class="menuButton" value="birthday">When is your birthday?</button>
	</div>
</div>
<div id="spellName" class="view" style="display: none;">
	<div class="title" id="spellNameTitle">How do you spell your name?</div>
	<div id="alphabet">
		<button class="letter" value="A">A</button>
		<button class="letter" value="B">B</button>
		<button class="letter" value="C">C</button>
		<button class="letter" value="D">D</button>
		<button class="letter" value="E">E</button>
		<button class="letter" value="F">F</button>
		<button class="letter" value="G">G</button>
		<button class="letter" value="H">H</button>
		<button class="letter" value="I">I</button>
		<button class="letter" value="J">J</button>
		<button class="letter" value="K">K</button>
		<button class="letter" value="L">L</button>
		<button class="letter" value="M">M</button>
		<button class="letter" value="N">N</button>
		<button class="letter" value="O">O</button>
		<button class="letter" value="P">P</button>
		<button class="letter" value="Q">Q</button>
		<button class="letter" value="R">R</button>
		<button class="letter" value="S">S</button>
		<button class="letter" value="T">T</button>
		<button class="letter" value="U">U</button>
		<button class="letter" value="V">V</button>
		<button class="letter" value="W">W</button>
		<button class="letter" value="X">X</button>
		<button class="letter" value="Y">Y</button>
		<button class="letter" value="Z">Z</button>
		<button class="letter" value=" ">_</button>
		<button class="letter" id="backspace" value="" style="background: pink">&leftarrow;</button>
	</div>
</div>
<div id="subject" class="view" style="display: none;">
	<div class="title">What subject do you like?</div>
	<div id="subjectButtons"></div>
</div>
<div id="birthday" class="view" style="display: none;">
	<div class="title">When is your birthday?</div>
	<div id="monthButtons"></div>
</div>
	</body>
	<script type="module">
import Loader from "../js_modules/Loader.mjs"
import images from "../../image_library.mjs"

function menuButtonClickHandler(ev) {
	console.log("Switching to", ev.target.value);
	viewMenu.style.display = "none";
	window[ev.target.value].style.display = "flex";
}
function letterButtonClickHandler(ev) {
	console.log("Letter is", ev.target.value);
	if (viewSpellNameTitle.innerHTML === "How do you spell your name?") {
		viewSpellNameTitle.innerHTML = ev.target.value;
	} else {
		viewSpellNameTitle.innerHTML += ev.target.value;
	}
}
function backspaceButtonClickHandler(ev) {
	let name = viewSpellNameTitle.innerHTML;
	viewSpellNameTitle.innerHTML = name.slice(0, name.length-1);
}
const PATH_TO_IMAGES = "../../images/";
const viewMenu = document.getElementById("menu");
const viewSpellName = document.getElementById("spellName");
const viewSpellNameTitle = document.getElementById("spellNameTitle");
const SUBJECTS = ["Japanese", "math", "art", "English", "social studies", "P.E.", "calligraphy", "home economics", "music", "science"];
const divSubjectButtons = document.getElementById("subjectButtons");
const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const divMonthButtons = document.getElementById("monthButtons");

Array.from(document.getElementsByClassName("menuButton")).forEach(el => el.addEventListener("click", menuButtonClickHandler));
Array.from(document.getElementsByClassName("letter")).forEach(el => el.addEventListener("click", letterButtonClickHandler));
SUBJECTS.forEach(function (text) {
	let div = document.createElement("div");
	let input = document.createElement("input");
	let label = document.createElement("label");
	let img = document.createElement("img");
	let image_library_entry = images.filter(o => o.text === text)[0];
	let src = PATH_TO_IMAGES + image_library_entry.src;
	input.type = "radio";
	input.id = text;
	input.name = "subject";
	label.htmlFor = text;
	label.classList.add("subjectButton");
	img.src = src;
	label.appendChild(img);
	div.appendChild(input);
	div.appendChild(label);
	divSubjectButtons.appendChild(div);
});
MONTHS.forEach(function (text) {
	let div = document.createElement("div");
	let input = document.createElement("input");
	let label = document.createElement("label");
	let img = document.createElement("img");
	let image_library_entry = images.filter(o => o.text === text)[0];
	let src = PATH_TO_IMAGES + image_library_entry.src;
	input.type = "radio";
	input.id = text;
	input.name = "month";
	label.htmlFor = text;
	label.classList.add("monthButton");
	img.src = src;
	label.appendChild(img);
	div.appendChild(input);
	div.appendChild(label);
	divMonthButtons.appendChild(div);
});
document.getElementById("backspace").addEventListener("click", backspaceButtonClickHandler);
	</script>
</html>
