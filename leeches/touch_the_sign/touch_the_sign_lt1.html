<!DOCTYPE html>
<head>
	<style>
		body {
			margin: 0;
			touch-action: none;
			display: flex;
			flex-direction: column;
		}
		#points {
			height: 20vh;
			width: 100vw;
			display: flex;
			text-align: center;
		}
		#avg {
			background: pink;
			color: white;
			height: 100%;
			width: 20%;
		}
		#total {
			background: purple;
			color: white;
			height: 100%;
			width: 40%;
		}
		#toAdd {
			color: purple;
			height: 100%;
			width: 40%;
		}
		#game {
			width: 100vw;
			height: 80vh;
			display: flex;
			flex-direction: row;
		}
		#map {
			background: snow;
			width: 80vw;
			height: 80vh;
			display: flex;
			align-items: center;
			justify-content: start;
		}
		#map > canvas {
			height: 80vh;
		}
		#hint {
			background: orange;
			width: 20vw;
			display: flex;
			align-items: center;
			justify-content: center;
		}
	</style>
</head>
<body>
	<div id="points">
		<div id="avg"></div>
		<div id="total"></div>
		<div id="toAdd"></div>
	</div>
	<div id="game">
		<div id="map"></div>
		<div id="hint"></div>
	</div>
<script type="module" src="touch_the_sign_lt1_main.js">
</script>
</body>
</html>
